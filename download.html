<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<title>Theme Passport – Vivo Theme Store</title>
<script>try{var t=localStorage.getItem('vivo-theme-store-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgw"></div>
<main class="passport page">
  <div class="topline">
    <a href="index.html">← Back to store</a>
    <button id="themeToggle" class="ib glass g" type="button" aria-label="Switch theme"></button>
  </div>

  <section class="intro glass">
    <div class="eyebrow">VIVO THEME STORE</div>
    <h1>Theme Passport</h1>
    <p>Complete these seven quick steps before opening your theme download. Check the theme notes and confirm compatibility with your device.</p>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="progress"><span id="stepLabel">Step 1 of 7</span><span id="percent">14%</span></div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="panel glass">
    <div id="stage"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="actions">
      <button class="btn g" id="back" type="button">← Back</button>
      <button class="btn primary g" id="next" type="button">Continue →</button>
    </div>
  </section>
</main>

<script src="theme.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const title = params.get('title') || 'Vivo / iQOO Theme';
  const videoId = params.get('id') || '';
  const raw = params.get('url') || '';

  // Only allow the expected Google Drive download domains.
  const url = /^https:\/\/(drive\.google\.com|docs\.google\.com)\//i.test(raw) ? raw : '';

  let selectedSeries = '';
  let selectedDeviceName = '';
  let step = 0;
  let videoData = null;

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const stageDefinitions = [
    {
      title: 'Welcome',
      text: 'You are preparing to open the download for:',
      field: () => `<div class="summary"><b>${escapeHtml(title)}</b><br>Only download files from sources you trust.</div>`
    },
    {
      title: 'Choose your device',
      text: 'Select your device series and enter your exact phone model.',
      field: () => `
        <label class="field">Device Model / Series
          <select id="deviceSeries" required>
            <option value="">Select your series</option>
            <option>Vivo X Series</option><option>Vivo V Series</option><option>Vivo T Series</option>
            <option>Vivo Y Series</option><option>Vivo S Series</option><option>Vivo Z Series</option>
            <option>Vivo YUVA Series</option><option>iQOO Series</option><option>Other</option>
          </select>
        </label>
        <label class="field">Device Name
          <input id="deviceName" type="text" placeholder="e.g. Vivo X200 Pro" maxlength="80" autocomplete="off" required>
        </label>`
    },
    {
      title: 'Compatibility check',
      text: 'Confirm you have checked the theme video for OS/version compatibility.',
      field: () => '<label class="check"><input id="compat" type="checkbox"> I checked the compatibility details.</label>'
    },
    {
      title: 'Backup reminder',
      text: 'Back up important settings before applying a theme or changing system appearance.',
      field: () => '<label class="check"><input id="backup" type="checkbox"> I understand and have considered a backup.</label>'
    },
    {
      title: 'Source confirmation',
      text: 'Open the creator’s video if you need installation steps or extra information.',
      field: () => '<a class="btn g" href="https://www.youtube.com/@vivothemestore" target="_blank" rel="noopener noreferrer">Open YouTube channel ↗</a>'
    },
    {
      title: 'Ready',
      text: 'Review your choices before continuing to password verification.',
      field: () => '<div class="summary" id="finalSummary"></div>'
    },
    {
      title: 'Enter Video Password',
      text: 'Enter the password supplied for this video to continue to the download.',
      field: () => `
        <label class="field">Video password
          <input id="videoPassword" type="password" autocomplete="current-password" placeholder="Enter Video PW" required>
        </label>
        <p class="info">The password must match this video’s saved password.</p>`
    }
  ];

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), dots = $('dots'), fill = $('fill'), label = $('stepLabel'),
        percent = $('percent'), back = $('back'), next = $('next'), status = $('status');

  const say = (msg, error) => { status.textContent = msg; status.classList.toggle('error', !!error); };

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function loadVideoData() {
    try {
      const res = await fetch('./videos.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('Could not load videos.json');
      const data = await res.json();
      videoData = (data.videos || []).find((v) => String(v.id || '') === videoId) || null;
    } catch (e) {
      console.error('Password data error:', e);
      videoData = null;
    }
  }

  // Works with a hashed password (videoPWHash) or the older plain videoPW.
  async function passwordMatches(entered) {
    if (videoData.videoPWHash) {
      return (await sha256(videoId + ':' + entered)) === String(videoData.videoPWHash);
    }
    return entered === String(videoData.videoPW || '');
  }
  const hasPassword = () => !!(videoData.videoPWHash || videoData.videoPW);

  function render() {
    const cur = stageDefinitions[step];
    stage.innerHTML = `<h2>${cur.title}</h2><p class="info">${cur.text}</p>${cur.field()}`;

    if (step === 1) {
      $('deviceSeries').value = selectedSeries;
      $('deviceName').value = selectedDeviceName;
    }

    dots.innerHTML = stageDefinitions.map((_, i) => `<span class="dot ${i <= step ? 'active' : ''}"></span>`).join('');
    const pct = Math.round((step + 1) / stageDefinitions.length * 100);
    fill.style.width = pct + '%';
    label.textContent = `Step ${step + 1} of ${stageDefinitions.length}`;
    percent.textContent = pct + '%';
    back.disabled = step === 0;
    next.textContent = step === 5 ? 'Continue to password →' : step === 6 ? 'Verify password →' : 'Continue →';

    if (step === 5) {
      $('finalSummary').innerHTML =
        `<b>Theme:</b> ${escapeHtml(title)}<br>` +
        `<b>Device Series:</b> ${escapeHtml(selectedSeries)}<br>` +
        `<b>Device Name:</b> ${escapeHtml(selectedDeviceName)}<br>` +
        `<b>Download:</b> ${url ? 'Link available' : 'No direct download link supplied'}`;
    }
  }

  next.addEventListener('click', async () => {
    say('');

    if (step === 1) {
      selectedSeries = $('deviceSeries')?.value || '';
      selectedDeviceName = $('deviceName')?.value.trim() || '';
      if (!selectedSeries) return say('Please select your device series.', true);
      if (!selectedDeviceName) { $('deviceName')?.focus(); return say('Please enter your device name.', true); }
    }
    if (step === 2 && !$('compat')?.checked) return say('Please confirm you checked compatibility to continue.', true);
    if (step === 3 && !$('backup')?.checked) return say('Please acknowledge the backup reminder to continue.', true);

    if (step === 6) {
      const entered = $('videoPassword')?.value ?? '';
      if (!videoId) return say('This download link is missing its video ID. Return to the store and open the download again.', true);

      next.disabled = true;
      next.textContent = 'Checking…';
      if (!videoData) await loadVideoData();
      next.disabled = false;
      next.textContent = 'Verify password →';

      if (!videoData) return say('Could not find this video in videos.json. Please return to the store and try again.', true);
      if (!hasPassword()) return say('No password has been set for this video yet. Please contact the site owner.', true);

      let ok = false;
      try { ok = await passwordMatches(entered); }
      catch (e) { return say('Password check needs a secure (https) page.', true); }

      if (!ok) {
        say('Incorrect password. Please try again.', true);
        const input = $('videoPassword');
        input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
        return;
      }
      if (url) { say('Password accepted. Opening download…'); location.href = url; }
      else say('Password accepted, but no valid download link was supplied.', true);
      return;
    }

    if (step < stageDefinitions.length - 1) { step++; render(); }
  });

  back.addEventListener('click', () => {
    if (step === 1) {
      selectedSeries = $('deviceSeries')?.value || selectedSeries;
      selectedDeviceName = $('deviceName')?.value.trim() || selectedDeviceName;
    }
    if (step > 0) { step--; say(''); render(); }
  });

  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.g');
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--x', e.clientX - r.left + 'px');
    el.style.setProperty('--y', e.clientY - r.top + 'px');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  });

  render();
})();
</script>
</body>
</html>
