
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8ff">
<title>Theme Passport | Vivo Theme Store</title>
<link rel="stylesheet" href="style.css">
<style>
.passport{max-width:850px;margin:auto;padding:25px 0 50px}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:25px}
.back{color:#3658e8;font-weight:800;font-size:13px}
.intro,.panel{background:#fff;border:1px solid #e0e8f5;border-radius:24px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 35px #294b800c}
.intro{text-align:center;background:linear-gradient(145deg,#fff,#edf4ff)}
.orb{width:78px;height:78px;display:grid;place-items:center;margin:0 auto 18px;border-radius:25px;background:linear-gradient(140deg,#80b7ff,#3658e8);color:white;font-size:36px;box-shadow:0 10px 25px #4266e82e}
.kicker{font-size:10px;letter-spacing:2px;font-weight:850;color:#4267e7}
h1{font-size:clamp(32px,7vw,49px);letter-spacing:-2px;line-height:1.08;margin:12px 0}
h1 span{color:#4569f5}
.muted{color:#697995;font-size:13px;line-height:1.8}
.track{height:7px;background:#e5ecfa;border-radius:20px;margin:24px 0 8px;overflow:hidden}
.fill{height:100%;width:16.66%;background:linear-gradient(90deg,#4569f5,#62b8ff);transition:width .3s}
.progress{display:flex;justify-content:space-between;color:#697995;font-size:11px}
.dots{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px 0}
.dot{width:31px;height:31px;border:1px solid #dce5f5;background:#fff;color:#697995;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.dot.active{background:#4569f5;color:white;border-color:#4569f5}
.dot.done{background:#e6efff;color:#3156df}
.panel h2{font-size:25px;letter-spacing:-.8px;margin:8px 0}
.info{background:#f5f8ff;border:1px solid #e0e8f5;border-radius:15px;padding:16px;margin-top:13px;overflow-wrap:anywhere}
.info small{display:block;color:#697995;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.info strong{font-size:14px}
.info p{font-size:12px;color:#697995;margin:6px 0 0}
.field{display:block;font-size:12px;font-weight:800;margin:20px 0 8px}
select{width:100%;padding:13px;border:1px solid #dce5f5;border-radius:12px;background:#f9fbff;color:#14213d;font:inherit}
.checks{display:grid;gap:10px;margin-top:18px}
.check{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1px solid #e0e8f5;border-radius:13px;background:#fbfcff;font-size:13px}
.check input{margin-top:4px;accent-color:#4569f5}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{border:0;border-radius:13px;padding:14px 18px;font-size:13px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(110deg,#3e65ee,#568cff);color:white}
.secondary{background:#edf2ff;color:#3458d3;border:1px solid #dbe5ff}
.btn:disabled{opacity:.45}
.status{font-size:12px;color:#3156df;margin-top:12px;min-height:18px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.summary .info{margin:0}
ol{padding-left:22px;color:#43516b;font-size:13px;line-height:2}
@media(max-width:480px){.passport{padding-top:16px}.actions .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="passport">
  <div class="topline">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <span>Vivo <b>Theme Store</b><small>YOUR PHONE, YOUR STYLE.</small></span>
    </a>
    <a class="back" href="index.html">← Back to store</a>
  </div>

  <section class="intro">
    <div class="orb" id="orb">✦</div>
    <div class="kicker">YOUR PERSONAL THEME GUIDE</div>
    <h1 id="hero">Your Theme <span>Passport.</span></h1>
    <p class="muted" id="subtitle">Six useful stages to review your theme and prepare for installation.</p>
  </section>

  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="progress"><span id="stageCount">Stage 1 of 6</span><span id="percent">17%</span></div>
  <div class="dots" id="dots"></div>

  <section class="panel">
    <div class="kicker" id="stageLabel">STAGE 01</div>
    <h2 id="heading">Theme Arrival</h2>
    <div id="content"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="actions">
      <button class="btn secondary" id="back" type="button" disabled>← Back</button>
      <button class="btn primary" id="next" type="button">Start →</button>
    </div>
  </section>
  <footer><a href="index.html">Vivo Theme Store</a> · Unofficial fan-made showcase</footer>
</main>

<script>
const params = new URLSearchParams(location.search);
const theme = params.get('title') || 'Vivo Theme';
const devices = params.get('devices') || 'Not specified by creator';
let download = '';
try {
  const u = new URL(params.get('url') || '');
  if (u.protocol === 'https:' &&
      ['drive.google.com','docs.google.com'].includes(u.hostname)) {
    download = u.href;
  }
} catch {}

const state = {
  device: '',
  backup: false,
  source: false,
  compatible: false
};
let stage = 0;

const stages = [
  ['✦','THEME ARRIVAL','Meet your next setup','Review the selected theme and start your customization journey.','Start journey →'],
  ['▣','DEVICE MATCH','Choose your device','Select your device family and review the compatibility details supplied with this theme.','Check theme details →'],
  ['◈','THEME ANATOMY','Understand the package','Review the file type, creator instructions and compatibility before installing.','Prepare my device →'],
  ['✓','READY CHECK','A quick preparation check','Confirm that you have reviewed the source, backup and compatibility information.','Build my passport →'],
  ['▤','THEME PASSPORT','Your personal summary','Review the selections you made in this session.','Open download studio →'],
  ['↓','DOWNLOAD STUDIO','Continue to your theme','Open the supplied file link, if available, and follow the creator’s installation guide.','Finish']
];

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function info(label,value,description='') {
  return `<div class="info"><small>${esc(label)}</small><strong>${esc(value)}</strong>${description ? `<p>${esc(description)}</p>` : ''}</div>`;
}

function drawDots() {
  $('dots').innerHTML = stages.map((s,i) =>
    `<span class="dot ${i===stage?'active':i<stage?'done':''}">${i<stage?'✓':i+1}</span>`
  ).join('');
}

function render() {
  const s = stages[stage];
  $('orb').textContent = s[0];
  $('hero').innerHTML = `${esc(s[2].split(' ').slice(0,-1).join(' '))} <span>${esc(s[2].split(' ').slice(-1)[0])}</span>`;
  $('subtitle').textContent = s[3];
  $('stageLabel').textContent = `STAGE 0${stage+1} / ${s[1]}`;
  $('heading').textContent = s[2];
  $('fill').style.width = ((stage+1)/stages.length*100)+'%';
  $('stageCount').textContent = `Stage ${stage+1} of ${stages.length}`;
  $('percent').textContent = Math.round((stage+1)/stages.length*100)+'%';
  $('back').disabled = stage===0;
  $('next').textContent = s[4];
  $('next').disabled = false;
  $('status').textContent = '';
  drawDots();

  if(stage===0) {
    $('content').innerHTML =
      `<p class="muted">Your journey starts here. This guide does not install anything or verify device compatibility automatically.</p>`+
      info('SELECTED THEME',theme)+info('CREATOR DEVICE NOTES',devices);
  } else if(stage===1) {
    $('content').innerHTML = `
      <p class="muted">Choose the closest device family. This selection is for your reference only.</p>
      <label class="field" for="device">YOUR DEVICE FAMILY</label>
      <select id="device">
        <option value="">Select device family</option>
        <option>Vivo X Series</option><option>Vivo V Series</option>
        <option>Vivo Y Series</option><option>iQOO Series</option>
        <option>Other Android device</option>
      </select>`+info('CREATOR COMPATIBILITY NOTES',devices);
    $('device').value = state.device;
    $('device').addEventListener('change',e=>state.device=e.target.value);
  } else if(stage===2) {
    $('content').innerHTML =
      info('01 · FILE TYPE','Check the downloaded file','Make sure the extension matches the creator’s instructions.')+
      info('02 · SOFTWARE','Check your OS version','Themes may behave differently across device models and software versions.')+
      info('03 · TRUSTED SOURCE','Review before opening','Avoid unexpected installers and files from sources you do not trust.');
  } else if(stage===3) {
    $('content').innerHTML = `<div class="checks">
      <label class="check"><input type="checkbox" id="backup" ${state.backup?'checked':''}> I have considered backing up my current setup.</label>
      <label class="check"><input type="checkbox" id="source" ${state.source?'checked':''}> I trust the source of this theme file.</label>
      <label class="check"><input type="checkbox" id="compat" ${state.compatible?'checked':''}> I reviewed the available compatibility notes.</label>
    </div>`;
    $('backup').addEventListener('change',e=>state.backup=e.target.checked);
    $('source').addEventListener('change',e=>state.source=e.target.checked);
    $('compat').addEventListener('change',e=>state.compatible=e.target.checked);
  } else if(stage===4) {
    $('content').innerHTML = `<div class="summary">
      ${info('THEME',theme)}
      ${info('DEVICE FAMILY',state.device||'Not selected')}
      ${info('COMPATIBILITY',state.compatible?'Reviewed by you':'Not confirmed')}
      ${info('BACKUP CHECK',state.backup?'Checked':'Not checked')}
    </div><p class="muted">This is an informational summary, not an official Vivo certificate or a guarantee of compatibility.</p>`;
  } else {
    $('content').innerHTML =
      info('SELECTED THEME',theme)+
      (download
        ? `<div class="info"><small>DOWNLOAD LINK</small><p>Open the supplied Google Drive file and check its details before downloading.</p><a class="btn primary" style="display:inline-block;margin-top:12px" href="${esc(download)}" target="_blank" rel="noopener noreferrer">Open theme link ↗</a></div>`
        : info('DOWNLOAD NOT PROVIDED','No verified Google Drive link was supplied','Return to the store and check whether a download link is available.'))+
      `<h2 style="margin-top:22px">Installation guide</h2>
       <ol><li>Read the creator’s installation instructions.</li>
       <li>Confirm the file type and device compatibility.</li>
       <li>Use the theme options supported by your phone.</li>
       <li>If the instructions do not match your device, stop and check official guidance.</li></ol>`;
  }
}

function advance() {
  if(stage===1 && !state.device) {
    $('status').textContent='Please select your device family first.';
    return;
  }
  if(stage===3 && !(state.backup && state.source && state.compatible)) {
    $('status').textContent='Review and check all three items to continue.';
    return;
  }
  if(stage<5) {
    stage++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    $('status').textContent='Theme guide completed. Thank you!';
    $('next').textContent='✓ Completed';
    $('next').disabled=true;
  }
}

$('next').addEventListener('click',advance);
$('back').addEventListener('click',()=>{
  if(stage>0){stage--;render();window.scrollTo({top:0,behavior:'smooth'});}
});
render();
</script>
</body>
</html>
