<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<title>Vivo Theme Store</title>
<script>try{var t=localStorage.getItem('vivo-theme-store-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgw"></div>
<div class="fl" id="fl" aria-hidden="true"></div>

<div class="top">
  <button class="ib glass g" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false"></button>
  <label class="sb glass">
    <span id="searchIcon" style="display:grid;color:var(--mut)" aria-hidden="true"></span>
    <input id="searchInput" type="search" placeholder="Search themes" aria-label="Search themes">
  </label>
  <button class="ib glass g" id="themeToggle" type="button" aria-label="Switch theme"></button>
</div>
<div class="menu glass" id="menu" role="menu"></div>

<main>
  <div class="hero">
    <div class="stage" id="stage">
      <div class="ph glass g" id="phone">
        <div class="scr">
          <small id="dateText"></small>
          <b id="clockText">9:41</b>
          <div class="ap"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
    <h1>Vivo Theme Store</h1>
    <p>Custom themes for Vivo and iQOO.</p>
    <div class="cue">Scroll down ↓</div>
  </div>

  <section class="s" id="sec-members"><h2>Premium Members</h2><div class="mem" id="memberList"></div></section>
  <section class="s" id="sec-latest"><h2>Recent Videos</h2><div class="grid" id="latestGrid"></div></section>
  <section class="s" id="sec-premium"><h2>Premium Videos</h2><div class="grid" id="premiumGrid"></div></section>
  <section class="s" id="sec-live"><h2>Live Streams</h2><div class="grid" id="liveGrid"></div></section>
  <section class="s" id="sec-widgets"><h2>Widgets and Documents</h2><div class="grid" id="widgetsGrid"></div></section>
  <section class="s" id="sec-comments">
    <h2>Comments</h2>
    <div class="com">
      <a class="glass g" id="ytComment" href="https://www.youtube.com/@vivothemestore" target="_blank" rel="noopener noreferrer">Comment on YouTube</a>
      <a class="glass g" id="telegramLink" href="#" target="_blank" rel="noopener noreferrer">Chat on Telegram</a>
    </div>
    <div class="grid" id="communityGrid"></div>
  </section>

  <footer class="foot">Vivo Theme Store · <a id="footerTelegram" href="#" target="_blank" rel="noopener noreferrer">Telegram</a> · <a href="admin.html">Admin</a></footer>
</main>

<nav class="dock glass" id="dock" aria-label="Sections"></nav>

<script src="theme.js"></script>
<script src="app.js"></script>
</body>
</html>
